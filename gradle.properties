# Gradle JVM args
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# AndroidX
android.useAndroidX=true
# Non-transitive R classes (faster build)
android.nonTransitiveRClass=true
# Build cache and parallel
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin official code style
kotlin.code.style=official

# ===== App version (single source of truth; bump via tools/release.ps1) =====
# versionCode: strictly increasing integer; Android uses it to detect updates
VERSION_CODE=3
# versionName: semantic version MAJOR.MINOR.PATCH shown to users
VERSION_NAME=0.3.0
