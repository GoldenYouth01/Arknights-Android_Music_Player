# Gradle JVM 参数
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# AndroidX
android.useAndroidX=true
# 非传递 R 类（更快构建）
android.nonTransitiveRClass=true
# 构建缓存与并行
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin 官方代码风格
kotlin.code.style=official

# ===== 应用版本（唯一来源，发布时用 tools/release.ps1 统一修改）=====
# versionCode：单调递增的整数，Android 系统据此判断是否为"更新"
VERSION_CODE=1
# versionName：展示给用户的语义化版本号（MAJOR.MINOR.PATCH）
VERSION_NAME=0.1.0
